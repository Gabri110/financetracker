# Docker Compose for self-hosted FinanceTracker
# Usage: docker compose up -d   ->  http://localhost:8000

services:
  financetracker:
    build: .
    container_name: financetracker
    restart: unless-stopped
    ports:
      # Bound to localhost only; put a TLS reverse proxy in front before exposing it.
      - "127.0.0.1:8000:8000"
    volumes:
      # Holds finance.db, the generated secret key and raw/<bank>/ statement folders.
      - finance_data:/data
    environment:
      # Optional: leave unset to use the key generated in /data/secret_key.
      - SECRET_KEY=${SECRET_KEY:-}
      - REGISTRATION_ENABLED=${REGISTRATION_ENABLED:-false}

volumes:
  finance_data:
    driver: local
